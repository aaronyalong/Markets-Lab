project:
  type: website
  output-dir: _site
  # Writes the data-driven parts of the NVIDIA page from the prediction log and the
  # backtest report before every render.
  pre-render: uv run python -m markets_lab.analysis.nvda.site_page --site-dir .
  # Rewrites canonical links and the sitemap to the clean addresses the host
  # serves (it redirects ".html" to them).
  post-render: uv run python -m markets_lab.site_urls --built-dir _site

website:
  title: "Markets Lab"
  # The public address. Quarto uses it for the sitemap and, with canonical-url
  # below, for each page's canonical link. It must match the route in wrangler.jsonc.
  site-url: "https://markets.aaronyalong.com"
  description: "Hobby research on markets: every result has a baseline, an honest uncertainty, and no advice."
  navbar:
    # The brand carries the byline; page titles still use the plain site title.
    title: "Markets Lab [by Aaron Yalong]{.brand-by}"
    right:
      - href: index.qmd
        text: Home
      - text: Experiments
        menu:
          - href: experiments/nvidia.qmd
            text: NVIDIA predictor
      - href: method.qmd
        text: Method
      - href: disclaimer.qmd
        text: Disclaimer
  page-footer:
    center: "Research and education only. **Not financial advice.** No buy or sell signals. [Read the disclaimer](/disclaimer.qmd). [Built by [Aaron Yalong](https://aaronyalong.com).]{.byline}"

format:
  html:
    theme: [darkly, theme.scss]
    include-in-header: _includes/fonts.html
    include-after-body:
      - _includes/countup.html
      - _includes/session-dates.html
    toc: false
    canonical-url: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
