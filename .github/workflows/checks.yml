name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so the log can be compared with the one before.
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run pyright

      # The log must be valid, and it must be the previous commit's log with lines
      # only added: a commit that rewrites it fails here.
      - name: Verify the prediction log
        run: |
          if [ ! -f predictions/nvda.jsonl ]; then
            echo "No prediction log yet."
          elif git cat-file -e HEAD^:predictions/nvda.jsonl 2>/dev/null; then
            git show HEAD^:predictions/nvda.jsonl > "$RUNNER_TEMP/previous.jsonl"
            uv run python -m markets_lab.analysis.nvda.prediction_log verify \
              --previous "$RUNNER_TEMP/previous.jsonl"
          else
            uv run python -m markets_lab.analysis.nvda.prediction_log verify
          fi
