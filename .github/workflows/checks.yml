name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run pyright

      - name: Verify the prediction log
        run: |
          if [ -f predictions/nvda.jsonl ]; then
            uv run python -m markets_lab.analysis.nvda.prediction_log verify
          else
            echo "No prediction log yet."
          fi
