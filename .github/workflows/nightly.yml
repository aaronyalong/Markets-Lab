name: Nightly NVDA prediction

# Records which way finished sessions closed and appends each model's call on the
# next session to predictions/nvda.jsonl. Research only, not financial advice.
#
# Timing: predictions must be written before the US market opens (09:30 New York,
# which is 13:30 or 14:30 UTC). Yahoo can take hours after the close to publish the
# final bar (seen once: between 21:00 and 21:28 New York), and the context models
# wait for a fixed 20:00 New York cut-off. Every run after the first successful one
# is a retry and adds nothing.
#
# GitHub starts scheduled jobs late, by a varying and growing amount: 7 to 8.5
# hours on 2026-11-19 to 22, 9.9 to 12.1 hours on 2026-11-23 and 24. With the
# four morning times alone, a delay of 10 to 12.5 hours put no run between the
# 20:00 cut-off and the open. So the job runs eight times a day, never more than
# 6.5 hours apart. The window is 13.5 hours long, so whatever the delay (up to a
# whole day), at least two runs start inside it: one to make the calls and one
# retry. A test checks this against the log's own window and cut-off, in winter
# and summer time. Runs that start during the session find nothing to do.
#
# The context models need two more downloads (index closes from Yahoo, filing times
# from SEC). If those fail, the other predictors' calls are still written and
# committed, and the job then fails at its last step so the gap is noticed. A later
# run adds the missing calls only while the market has not opened; after that the
# day stays missing for those models.

on:
  schedule:
    # New York times: winter, then summer. Minutes avoid the top of the hour,
    # when GitHub's scheduler is busiest.
    - cron: "45 18 * * *" # 13:45 or 14:45 New York, during the session (for a late start)
    - cron: "45 20 * * *" # 15:45 or 16:45 New York
    - cron: "45 22 * * *" # 17:45 or 18:45 New York
    - cron: "15 0 * * *" # 19:15 or 20:15 New York
    - cron: "30 3 * * *" # 22:30 or 23:30 New York, the evening of the session
    - cron: "30 6 * * *" # 01:30 or 02:30 New York
    - cron: "30 10 * * *" # 05:30 or 06:30 New York
    - cron: "15 12 * * *" # 07:15 or 08:15 New York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-nvda-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG: predictions/nvda.jsonl
      # Optional. SEC asks automated clients to identify themselves; set this
      # secret to a client name with a contact. A generic name is used without it.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Keep a copy of the committed log
        run: |
          if [ -f "$LOG" ]; then
            cp "$LOG" "$RUNNER_TEMP/previous.jsonl"
          else
            : > "$RUNNER_TEMP/previous.jsonl"
          fi

      # Exit code 3 means the log was written but the context models made no call.
      # The log is still verified and committed below; the last step then fails
      # the job. Any other failure stops here, with nothing written.
      - name: Record outcomes and append predictions
        id: nightly
        env:
          # The log refuses every writer but this step (see prediction_log.py).
          MARKETS_LAB_LOG_WRITER: nightly-workflow
        run: |
          set +e
          uv run python -m markets_lab.analysis.nvda.nightly --log "$LOG"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      # Fails the job if any earlier line was changed, removed or reordered, or if
      # any rule of the log is broken. Nothing is committed unless this passes.
      - name: Verify the log
        run: |
          uv run python -m markets_lab.analysis.nvda.prediction_log verify \
            --log "$LOG" --previous "$RUNNER_TEMP/previous.jsonl"

      - name: Refuse to commit anything except the log
        run: |
          other="$(git status --porcelain --untracked-files=all -- . ":(exclude)$LOG")"
          if [ -n "$other" ]; then
            echo "Unexpected changes outside $LOG:"
            echo "$other"
            exit 1
          fi

      - name: Commit the log
        run: |
          if [ -z "$(git status --porcelain -- "$LOG")" ]; then
            echo "No new records; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$LOG"
          git commit -m "bot: append NVDA outcomes and predictions ($(date -u +%Y-%m-%d))"
          git push

      - name: Fail if the context models made no call
        if: steps.nightly.outputs.code == '3'
        run: |
          echo "The context models made no call in this run; see the step that ran the job."
          exit 1
